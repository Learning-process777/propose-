<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    text-align: center;
    background: pink url('93951d665c688bbc9ca596ac9ff8d7f0.jpg'); /* upload your love pattern image */
    background-size: cover;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .section { display: none; }

  h2, p {
    font-size: 5vw;          /* scales with screen size */
    color: white;            /* romantic white text */
    font-weight: bold;
    text-shadow: 2px 2px 6px #000; /* glow for readability */
    margin: 20px;
  }

  img {
    max-width: 90%;
    height: auto;
    border: 5px solid hotpink;
    border-radius: 12px;
    margin: 20px auto;
  }

  button {
    margin: 15px;
    padding: 15px 30px;
    font-size: 4vw;          /* scales with screen size */
    background-color: hotpink;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 2px 2px 6px #333;
  }
  button:hover {
    background-color: deeppink;
  }
</style>
</head>
<body>

<!-- Section 1 -->
<div id="start" class="section" style="display:block;">
  <h2>Please sit properly... only for you 💕</h2>
  <button onclick="showSection('note')">Open</button>
</div>

<!-- Section 2 -->
<div id="note" class="section">
  <h2>My dearest,</h2>
  <p>From the moment I met you, my life has been brighter. You mean the world to me, and I want to spend every moment making you smile.</p>
  <button onclick="showSection('photo')">Next</button>
</div>

<!-- Section 3 -->
<div id="photo" class="section">
  <h2>Here’s me, just for you 💖</h2>
  <img src="WhatsApp Image 2026-09-05 at 11.25.52.jpeg" alt="My Photo">
  <br>
  <button onclick="showSection('question')">Next</button>
</div>

<!-- Section 4 -->
<div id="question" class="section">
  <h2>Do you like it? 💕</h2>
  <button onclick="showProposal('yes')">Yes</button>
  <button onclick="showProposal('no')">No</button>
</div>

<!-- Section 5 -->
<div id="proposal" class="section">
  <h2 id="message"></h2>
</div>

<script>
function showSection(id) {
  document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

function showProposal(answer) {
  showSection('proposal');
  if (answer === 'yes') {
    document.getElementById("message").innerHTML = "Will you be my partner? 💍<br><br>I will never disappoint you.";
  } else {
    document.getElementById("message").innerHTML = "Will you be my partner? 💍<br><br>I will never forget you.";
  }
  // Close after 5 seconds
  setTimeout(() => window.close(), 5000);
}
</script>

</body>
</html>
